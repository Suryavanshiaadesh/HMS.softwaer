<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Aadis Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4cc9f0;
            --sidebar-bg: #1e1e2d;
            --sidebar-width: 280px;
            --sidebar-collapsed: 80px;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7fe;
            color: #2b3674;
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            padding: 30px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            white-space: nowrap;
            opacity: 1;
            transition: var(--transition);
        }

        .sidebar.collapsed .logo-text {
            opacity: 0;
            visibility: hidden;
        }

        .sidebar-menu {
            flex: 1;
            padding: 10px 15px;
            list-style: none;
            margin: 0;
        }

        .sidebar-link {
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 12px;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            white-space: nowrap;
        }

        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .sidebar-link i {
            font-size: 20px;
            width: 24px;
            margin-right: 15px;
            text-align: center;
        }

        .sidebar.collapsed .sidebar-link span {
            display: none;
        }

        .sidebar.collapsed .sidebar-link i {
            margin-right: 0;
        }

        /* Profile Section */
        .profile-section {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-img {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .profile-info {
            color: white;
            overflow: hidden;
        }

        .profile-info h6 {
            margin: 0;
            font-weight: 700;
            font-size: 14px;
        }

        .profile-info small {
            opacity: 0.6;
            font-size: 12px;
        }

        .sidebar.collapsed .profile-info {
            display: none;
        }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: var(--transition);
            min-height: 100vh;
        }

        .sidebar.collapsed ~ .main-content {
            margin-left: var(--sidebar-collapsed);
        }

        /* Side Panel Styling */
        .side-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: calc(100% - var(--sidebar-width));
            height: 100%;
            background: #f4f7fe;
            z-index: 900;
            transform: translateX(100%);
            transition: var(--transition);
            padding: 40px;
            overflow-y: auto;
        }

        .sidebar.collapsed ~ .side-panel {
            width: calc(100% - var(--sidebar-collapsed));
        }

        .side-panel.active {
            transform: translateX(0);
        }

        .close-btn {
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            color: var(--primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Cards & UI Elements */
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            border: none;
            transition: var(--transition);
            height: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .icon-blue { background: #e7eefb; color: #4361ee; }
        .icon-green { background: #e6f6f4; color: #05cd99; }
        .icon-orange { background: #fef5ee; color: #ff9966; }
        .icon-purple { background: #f4f1fd; color: #6a11cb; }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #1b2559;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #a3aed0;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            margin-top: 30px;
        }

        .table thead th {
            background: transparent;
            border-bottom: 1px solid #f1f4f9;
            color: #a3aed0;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            padding: 15px;
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
            color: #2b3674;
            font-weight: 600;
            border-bottom: 1px solid #f1f4f9;
        }

        .badge-success { background: #e6f6f4; color: #05cd99; }
        .badge-danger { background: #fdeef1; color: #ee5d50; }

        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 700;
            box-shadow: 0 4px 14px 0 rgba(67, 97, 238, 0.39);
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #f1f4f9;
            background: #f4f7fe;
        }

        .form-control:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: none;
        }

        /* Notifications */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            padding: 4px 6px;
            border-radius: 50%;
            font-size: 10px;
        }

        .complaint-item {
            padding: 20px;
            border-radius: 16px;
            background: #f8f9fa;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            transition: var(--transition);
        }

        .complaint-item:hover {
            background: white;
            box-shadow: var(--card-shadow);
        }
    </style>
</head>

    /* // WebSocket Logic */
        let stompClient = null;
        let isConnected = false;
        let notifications = [];
        let receivedMessages = new Set();

        function connectAdminSocket() {
            if (isConnected) return;
            let socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function () {
                isConnected = true;
                stompClient.subscribe('/topic/messages', function (data) {
                    let msg = JSON.parse(data.body);
                    let key = msg.studentName + msg.content + msg.roomNumber;
                    if (receivedMessages.has(key)) return;
                    receivedMessages.add(key);
                    notifications.push(msg);
                    updateNotificationUI();
                });
            });
        }

        function updateNotificationUI() {
            let countEl = document.getElementById("notiCount");
            let list = document.getElementById("complaintList");
            if (!countEl || !list) return;
            countEl.innerText = notifications.length;
            list.innerHTML = "";
            notifications.forEach(msg => {
                let div = document.createElement("div");
                div.className = "complaint-item";
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="fw-700 mb-1">${msg.studentName} ${msg.roomNumber ? `<span class="text-muted">(Room ${msg.roomNumber})</span>` : ''}</h6>
                            <p class="mb-0 text-muted">${msg.content}</p>
                        </div>
                        <span class="badge badge-danger">New</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function toggleNotifications() {
            let box = document.getElementById("notificationBox");
            box.style.display = (box.style.display === "none") ? "block" : "none";
        }

        // Panel Management
        function openPanel(section) {
            const panel = document.getElementById("sidePanel");
            const content = document.getElementById("panelContent");
            const dashboardHome = document.getElementById("dashboardHome");
            
            // Update active link
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
                if(link.innerText.includes(section)) link.classList.add('active');
            });

            if (section === "Dashboard") {
                panel.classList.remove("active");
                dashboardHome.style.display = "block";
                loadComplaints();
                return;
            }

            dashboardHome.style.display = "none";
            panel.classList.add("active");

            switch (section) {
                case "StudentList":
                    content.innerHTML = `
                        <h3 class="fw-800 mb-4">Student Directory</h3>
                        <div class="table-card p-0 shadow-none">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Mobile</th>
                                        <th>Parent Mobile</th>
                                        <th>Due Date</th>
                                        <th>Room No</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>`;
                    loadStudents();
                    break;

                case "AddStudent":
                    content.innerHTML = `
                        <h3 class="fw-800 mb-4">Register New Student</h3>
                        <div class="table-card">
                            <form id="saveStudent">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Full Name</label>
                                        <input class="form-control" name="name" placeholder="Enter name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Mobile Number</label>
                                        <input class="form-control" name="mobileNumber" placeholder="Enter mobile" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email Id</label>
                                        <input class="form-control" name="emailid" placeholder="Enter email id" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Parent Mobile</label>
                                        <input class="form-control" name="parentMobileNumber" placeholder="Enter parent mobile" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Fee Due Date</label>
                                        <input class="form-control" type="date" name="dueDate" required>
                                    </div>
                                    <div class="col-12 mt-4">
                                        <button id="saveBtn" class="btn btn-primary">Register Student</button>
                                    </div>
                                </div>
                            </form>
                        </div>`;
                    loadAddStudentForm();
                    break;

                case "Rooms":
                    content.innerHTML = `
                        <h3 class="fw-800 mb-4">Add New Room</h3>
                        <div class="table-card">
                            <form id="saveRoomForm" method="post" enctype="multipart/form-data" action="/saveRoom">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Room Number</label>
                                        <input type="text" class="form-control" name="roomNumber" placeholder="e.g. 101" required />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Room Type</label>
                                        <select name="type" class="form-select" required>
                                            <option value="">Select Type</option>
                                            <option value="single">Single</option>
                                            <option value="double">Double</option>
                                            <option value="triple">Triple</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Bed Image</label>
                                        <input type="file" class="form-control" name="images" required />
                                        <input type="hidden" name="imageTypes" value="bed" />
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Bathroom Image</label>
                                        <input type="file" class="form-control" name="images" required />
                                        <input type="hidden" name="imageTypes" value="bathroom" />
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Gallery Image</label>
                                        <input type="file" class="form-control" name="images" required />
                                        <input type="hidden" name="imageTypes" value="gallery" />
                                    </div>
                                    <div class="col-12 mt-4">
                                        <button id="saveRoomBtn" type="submit" class="btn btn-primary">Save Room Details</button>
                                    </div>
                                </div>
                            </form>
                        </div>`;
                    loadRoomForm();
                    break;

                case "VacantRooms":
                    content.innerHTML = `
                        <h3 class="fw-800 mb-4">Available Rooms</h3>
                        <div class="table-card p-0 shadow-none">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Preview</th>
                                        <th>Room Number</th>
                                        <th>Type</th>
                                        <th>Capacity</th>
                                        <th>Occupied</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="RoomTableBody"></tbody>
                            </table>
                        </div>`;
                    loadVacantRoom();
                    break;

                case "DuePayments":
                	content.innerHTML = `
                        <h3 class="fw-800 mb-4">Student Directory</h3>
                        <div class="table-card p-0 shadow-none">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Mobile</th>
                                        <th>Due Date</th>
                                        <th>Room No</th>
                                        
                                    </tr>
                                </thead>
                                <tbody id="dueStudentTableBody"></tbody>
                            </table>
                        </div>`;
                    loadDueStudents();
                    break;
            }
        }

            document.getElementById("sidePanel").classList.remove("active");
            document.getElementById("dashboardHome").style.display = "block";
            document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
            document.querySelector('.sidebar-link:first-child').classList.add('active');
        }

        function loadComplaints() {
            fetch("http://localhost:8080/messages")
                .then(response => response.json())
                .then(data => {
                    let complaintsDiv = document.getElementById("complaints");
                    if (!complaintsDiv) return;
                    complaintsDiv.innerHTML = "";
                    let pendingCount = 0;
                    data.forEach(msg => {
                        if(msg.status === false) {
                            pendingCount++;
                            let item = `
                                <div class="complaint-item">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h6 class="fw-700 mb-1 text-primary">${msg.studentName} <small class="text-muted ms-2">${new Date(msg.createdAt).toLocaleDateString()}</small></h6>
                                            <p class="mb-2">${msg.content}</p>
                                            <span class="badge bg-light text-dark">Room: ${msg.roomNumber}</span>
                                        </div>
                                        <button class="btn btn-success btn-sm rounded-pill px-3" onclick="setResolve(${msg.id})">Resolve</button>
                                    </div>
                                </div>`;
                            complaintsDiv.innerHTML += item;
                        }
                    });
                    if(pendingCount === 0) complaintsDiv.innerHTML = '<p class="text-muted">No pending complaints at the moment.</p>';
                });
        }

        function setResolve(id) {
            fetch(`http://localhost:8080/setResolve/${id}`, { method: "POST" })
                .then(response => response.text())
                .then(data => {
                    Swal.fire("Resolved", data, "success");
                    loadComplaints();
                });
        }

        

        async function loadVacantRoom() {
            const response = await fetch("/getVacantRooms");
            const rooms = await response.json();
            const tableBody = document.getElementById("RoomTableBody");
            let rows = "";
            rooms.forEach(room => {
                let imageHTML = (room.images && room.images.length > 0)
                    ? `<img src="data:image/jpeg;base64,${room.images[0].image}" style="width:60px;height:45px;object-fit:cover;border-radius:8px;">`
                    : `<span class="text-muted small">No Image</span>`;
                rows += `
                    <tr>
                        <td>${imageHTML}</td>
                        <td>${room.roomNumber}</td>
                        <td>${room.type}</td>
                        <td>${getCapacity(room.type)}</td>
                        <td>${room.occupied || 0}</td>
                        <td><span class="badge badge-success">Vacant</span></td>
                    </tr>`;
            });
            tableBody.innerHTML = rows;
        }

        function getCapacity(type) {
            switch(type.toLowerCase()){
                case "single": return 1;
                case "double": return 2;
                case "triple": return 3;
                default: return 1;
            }
        }
	
        	
        async function loadStudents() {
            const response = await fetch("/getAllStudents");
            const students = await response.json();
            const tableBody = document.getElementById("studentTableBody");
            let rows = "";
            students.forEach(student => {
                let actionHTML = student.room
                    ? `<span class="badge badge-success">Allocated</span>`
                    : `<button class="btn btn-primary btn-sm" onclick="showRooms(${student.id})">Allocate Room</button>`;
                rows += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.mobileNumber}</td>
                        <td>${student.parentMobileNumber}</td>
                        <td>${new Date(student.dueDate).toLocaleDateString()}</td>
                        <td><span class="badge bg-light text-dark">${student.room ? student.room.roomNumber : "N/A"}</span></td>
                        <td>${actionHTML}</td>
                    </tr>`;
            });
            tableBody.innerHTML = rows;
        }

        }

        function loadAddStudentForm() {
            const form = document.getElementById("saveStudent");
            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                const btn = document.getElementById("saveBtn");
                btn.disabled = true; 
                btn.innerText = "Processing...";
                const data = {
                    name: form.name.value,
                    mobileNumber: form.mobileNumber.value,
                    emailid:form.emailid.value,
                    parentMobileNumber: form.parentMobileNumber.value,
                    dueDate: form.dueDate.value
                };
                await fetch("/saveStudentForm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                Swal.fire("Success", "Student registered successfully", "success");
                form.reset();
                btn.disabled = false; 
                btn.innerText = "Register Student";
            });
        }

        function loadRoomForm() {
            const form = document.getElementById("saveRoomForm");
            form.addEventListener("submit", async function(e) {
                e.preventDefault();
                const saveBtn = document.getElementById("saveRoomBtn");
                saveBtn.disabled = true; saveBtn.innerText = "Saving...";
                const formData = new FormData(form);
                try {
                    const response = await fetch("/saveRoom", { method: "POST", body: formData });
                    const result = await response.text();
                    Swal.fire("Success", result, "success");
                    form.reset();
                } catch(err) { Swal.fire("Error", "Failed to save room", "error"); }
                saveBtn.disabled = false; saveBtn.innerText = "Save Room Details";
            });
        }

        async function showRooms(studentId) {
            const response = await fetch("/getVacantRooms");
            const rooms = await response.json();
            let html = `<div class="row g-3">`;
            rooms.forEach(room => {
                let carouselId = "carousel" + room.roomId;
                let imagesHTML = "";
                if (room.images && room.images.length > 0) {
                    imagesHTML += `<div id="${carouselId}" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner">`;
                    room.images.forEach((img, index) => {
                        imagesHTML += `<div class="carousel-item ${index === 0 ? 'active' : ''}"><img src="data:image/jpeg;base64,${img.image}" style="width:100%; height:120px; object-fit:cover; border-radius:12px;"></div>`;
                    });
                    imagesHTML += `</div></div>`;
                } else { imagesHTML = `<div class="bg-light d-flex align-items-center justify-content-center" style="height:120px; border-radius:12px;"><i class="fas fa-image text-muted"></i></div>`; }
                
                html += `
                    <div class="col-md-4">
                        <div class="stat-card p-3 text-center">
                            ${imagesHTML}
                            <h6 class="mt-3 mb-1">Room ${room.roomNumber}</h6>
                            <p class="small text-muted mb-3">${room.type} (${getCapacity(room.type)})</p>
                            <button class="btn btn-primary btn-sm w-100" onclick="allocateRoom(${studentId}, ${room.roomId})">Select</button>
                        </div>
                    </div>`;
            });
            html += `</div>`;
            Swal.fire({ title: "Choose a Room", html: html, width: 800, showConfirmButton: false });
        }

        async function allocateRoom(studentId, roomId) {
            const response = await fetch(`/allocateRoom?studentId=${studentId}&roomId=${roomId}`, { method: "POST" });
            const result = await response.text();
            Swal.fire("Success", result, "success");
            loadStudents();
        }

        window.onload = function () {
            loadComplaints();
            setTimeout(connectAdminSocket, 300);
        };
    </script>
