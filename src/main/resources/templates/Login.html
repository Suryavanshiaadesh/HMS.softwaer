<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Aadis Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --bg-gradient: linear-gradient(135deg, #4361ee 0%, #4cc9f0 100%);
        }

        body {
            background: #f8f9fa;
            font-family: "Plus Jakarta Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--bg-gradient);
            clip-path: circle(70% at 100% 0%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h3 {
            font-weight: 800;
            margin-bottom: 10px;
            text-align: center;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .login-card p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 2px solid #eee;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .btn-login {
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.2);
        }

        .btn-login:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(67, 97, 238, 0.3);
            color: white;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
        }

        .form-footer a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: var(--secondary-color);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: var(--bg-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.2);
        }
    </style>
</head>
<body>
    <div class="bg-shapes"></div>
    <div class="login-card">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>Welcome Back</h3>
        <p>Enter your credentials to access your account</p>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin_user" required />
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-login">Sign In</button>
            <div class="form-footer">
                <a href="#">Forgot your password?</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const loginData = { username, password };

            try {
                const response = await fetch("/verifylogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(loginData)
                });

                const result = await response.json();
                if (response.ok) {
                    const userRoll = result.user.roll;
                    if (userRoll === "Admin") {
                        window.location.href = "/getAdminDashboard";
                    } else {
                        /* alert("✅ Login successful! Welcome " + result.userName.name.split(" ")[0]); */
                        window.location.href = "/getStudentDashboard";
                    }
                } else {
                    alert("❌ Login failed: " + (result.message || "Invalid credentials"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("⚠️ Something went wrong. Please try again later.");
            }
        });
    </script>
</body>
</html>
