<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Hostel Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to right, #6a11cb, #2575fc);
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.2);
        width: 400px;
        padding: 40px 30px;
      }

      .login-card h3 {
        font-weight: 700;
        margin-bottom: 25px;
        text-align: center;
        color: #333;
      }

      .form-control {
        border-radius: 10px;
      }

      .btn-login {
        background: linear-gradient(to right, #6a11cb, #2575fc);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        width: 100%;
        padding: 10px;
        transition: all 0.3s ease;
      }

      .btn-login:hover {
        transform: scale(1.05);
      }

      .form-footer {
        text-align: center;
        margin-top: 15px;
      }

      .form-footer a {
        text-decoration: none;
        color: #2575fc;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <h3><i class="bi bi-person-circle me-2"></i>Login</h3>
        <form action="/verifylogin" method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Enter username"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter password"
              required
            />
          </div>

          <!-- <button type="submit" class="btn-login >Login</button> -->
          <button type="submit" class="btn-login">Login</button>
          

          <div class="form-footer">
            <p class="mt-3 mb-1">
              Don’t have an account?
              <a href="register.html">Register</a>
            </p>
            <a href="#">Forgot password?</a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
  document.querySelector("form").addEventListener("submit", async function (event) {
    event.preventDefault(); // Stop normal form submit

    // Get username and password values
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
/* 	alert(username);
	alert(password); */
    // Prepare JSON object to send
    const loginData = { username, password };

    try {
      // Send request to Spring Boot endpoint
      const response = await fetch("/verifylogin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(loginData)
      });

      // Parse response
      const result = await response.json();
		const userRoll=result.user.roll;
		alert(userRoll);
      if (response.ok) {
		
        alert("✅ Login successful! Welcome " + result.username);
        if(userRoll==="Admin"){
        		window.location.href = "/getAdminDashboard";
        	}else{        	
        		window.location.href = "/getStudentDashboard";
        	}
        // Example: redirect after success
      } else {
        alert("❌ Login failed: " + (result.message || "Invalid credentials"));
      }
    } catch (error) {
      console.error("Error:", error);
      alert("⚠️ Something went wrong. Please try again later.");
    }
  });
</script>
    
  </body>
</html>
